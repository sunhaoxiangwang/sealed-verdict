[package]
name = "sealed-verdict-protocol-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly export of the Sealed Verdict certificate verifier for Node and browsers"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
sealed-verdict-protocol = { path = ".." }
wasm-bindgen = "=0.2.128"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
