<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMOKE RUNNING</title>
<style>
  :root { color-scheme: light dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { margin: 0; padding: 16px; background: Canvas; color: CanvasText; }
  h1 { font-size: 1.1rem; margin: 0 0 12px; }
  table { border-collapse: collapse; width: 100%; max-width: 720px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid color-mix(in srgb, CanvasText 20%, transparent); }
  .ok { color: #1a7f37; } .bad { color: #b42318; }
  pre { white-space: pre-wrap; font-size: 0.85rem; }
</style>
</head>
<body>
<h1 id="status">Loading verifier…</h1>
<p>Serve from <code>packages/protocol</code> (for example <code>pnpm smoke:browser</code>) and open
<code>/js/smoke.html</code>. ES modules and <code>fetch</code> do not run from <code>file://</code>.</p>
<table>
  <thead><tr><th>fixture</th><th>expected valid</th><th>got valid</th><th>match</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<pre id="log"></pre>
<script type="module">
  import { init, verifyCert, protocolVersion } from "./index.js";

  const names = ["valid_cert.json", "tampered_cert.json", "no_quorum_cert.json"];
  const status = document.getElementById("status");
  const tbody = document.getElementById("rows");
  const log = document.getElementById("log");
  const rows = [];
  let pass = false;

  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  try {
    await init();
    log.textContent += `init ok, protocol ${protocolVersion()}\n`;
    const expected = await (await fetch("../fixtures/expected.json")).json();
    for (const name of names) {
      const bundle = await (await fetch(`../fixtures/${name}`)).json();
      const got = verifyCert(bundle);
      const want = expected[name];
      const match = Boolean(want) && same(got, want);
      rows.push({ name, expectedValid: want ? want.valid : null, gotValid: got.valid, match, got, want });
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${name}</td><td>${want ? want.valid : "missing"}</td><td>${got.valid}</td>` +
        `<td class="${match ? "ok" : "bad"}">${match ? "match" : "MISMATCH"}</td>`;
      tbody.appendChild(tr);
      if (!match) log.textContent += `${name}\n  got:  ${JSON.stringify(got)}\n  want: ${JSON.stringify(want)}\n`;
    }
    pass = rows.length === names.length && rows.every((r) => r.match);
  } catch (err) {
    log.textContent += `error: ${err && err.stack ? err.stack : err}\n`;
    pass = false;
  }

  status.textContent = pass ? "SMOKE PASS" : "SMOKE FAIL";
  status.className = pass ? "ok" : "bad";
  document.title = pass ? "SMOKE PASS" : "SMOKE FAIL";
  window.__smokeResult = { pass, rows };
</script>
</body>
</html>
