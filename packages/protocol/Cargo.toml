[package]
name = "sealed-verdict-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Sealed Verdict wire types, canonical encoding, Ed25519 signatures, commitments, transcript chain, and certificate verifier"
publish = false

[lib]
name = "sealed_verdict_protocol"
path = "src/lib.rs"

[dependencies]
ed25519-dalek = "3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
