[package]
name = "sealed-verdict-actors"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Sealed Verdict in-memory actors: Clerk, Ledger, Oracle, juror signing shell, and scripted case runner"
publish = false

[lib]
name = "sealed_verdict_actors"
path = "src/lib.rs"

[[bin]]
name = "run_case"
path = "src/bin/run_case.rs"

[[bin]]
name = "gen_fixtures"
path = "src/bin/gen_fixtures.rs"

[dependencies]
sealed-verdict-protocol = { path = "../../packages/protocol" }
getrandom = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
