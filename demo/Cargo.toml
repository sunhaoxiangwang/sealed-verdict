[package]
name = "sv-aml"
version = "0.1.0"
edition = "2024"

[dependencies]
ed25519-dalek = "3.0.0"
hex = "0.4.3"
pyo3 = { version = "0.30.1", features = ["auto-initialize"], optional = true }
rand = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"

[features]
py = ["dep:pyo3"]
